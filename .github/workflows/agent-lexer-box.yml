name: agent-lexer-box

on:
  push:
    branches: ["agent/resolvent-stack-r0-r9"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolvent-stack-r0-r9
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt
      - name: Box private lexer errors
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/author.rs")
          text = p.read_text()
          text = text.replace(
              "Err(d) => return Err(AuthorError::Diagnostics(1, vec![d])),",
              "Err(d) => return Err(AuthorError::Diagnostics(1, vec![*d])),",
              1,
          )
          text = text.replace(
              "fn lex(source: &str) -> Result<Vec<Token>, Diagnostic> {",
              "fn lex(source: &str) -> Result<Vec<Token>, Box<Diagnostic>> {",
              1,
          )
          text = text.replace(
              '''return Err(\n                    Diagnostic::error("RSL-L000", "lex", "unclosed triple-quoted string")\n                        .at(SourceSpan::new(source, start, source.len()), "opened here"),\n                );''',
              '''return Err(Box::new(\n                    Diagnostic::error("RSL-L000", "lex", "unclosed triple-quoted string")\n                        .at(SourceSpan::new(source, start, source.len()), "opened here"),\n                ));''',
              1,
          )
          text = text.replace(
              '''return Err(Diagnostic::error("RSL-S000", "lex", "unclosed string")\n                    .at(SourceSpan::new(source, start, source.len()), "opened here"));''',
              '''return Err(Box::new(\n                    Diagnostic::error("RSL-S000", "lex", "unclosed string")\n                        .at(SourceSpan::new(source, start, source.len()), "opened here"),\n                ));''',
              1,
          )
          text = text.replace(
              '''return Err(Diagnostic::error(\n                    "RSL-X001",\n                    "lex",\n                    format!("unexpected character `{ch}`"),\n                )\n                .at(\n                    SourceSpan::new(source, start, start + width),\n                    "not valid RSL syntax",\n                ));''',
              '''return Err(Box::new(\n                    Diagnostic::error(\n                        "RSL-X001",\n                        "lex",\n                        format!("unexpected character `{ch}`"),\n                    )\n                    .at(\n                        SourceSpan::new(source, start, start + width),\n                        "not valid RSL syntax",\n                    ),\n                ));''',
              1,
          )
          p.write_text(text)
      - run: cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/author.rs
          git diff --cached --quiet && exit 0
          git commit -m "box private lexer diagnostics"
          git push origin HEAD:agent/resolvent-stack-r0-r9
