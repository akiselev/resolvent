name: wave-compile-fix
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Fix ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scientific.rs')
          s = p.read_text().replace('path: vec![name, eq.name.clone()],', 'path: vec![name.clone(), eq.name.clone()],')
          old = "    let derivatives = residual_blocks\n        .iter()\n        .flat_map(|r| {\n            field_names.iter().map(move |u| BlockDerivative {\n                residual: r.clone(),\n                unknown: u.clone(),\n                structurally_nonzero: edges.iter().any(|e| &e.to == r && &e.from == u),\n            })\n        })\n        .collect();"
          new = "    let mut derivatives = Vec::new();\n    for residual in &residual_blocks {\n        for unknown in &field_names {\n            derivatives.push(BlockDerivative {\n                residual: residual.clone(),\n                unknown: unknown.clone(),\n                structurally_nonzero: edges\n                    .iter()\n                    .any(|edge| &edge.to == residual && &edge.from == unknown),\n            });\n        }\n    }"
          if old not in s:
              raise SystemExit('expected derivative closure not found')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          rm -f clippy-diagnostic.log clippy-diagnostic.exit
          git rm .github/workflows/wave-compile-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix coupling graph ownership and clean diagnostics'
          git push origin HEAD:agent/r13-r20-wave-a-f
