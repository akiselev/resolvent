name: wave-compile-fix
on:
  push:
    branches: [agent/r13-r20-wave-a-f]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Fix ownership and clean diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scientific.rs')
          s = p.read_text()
          s = s.replace('path: vec![name, eq.name.clone()],', 'path: vec![name.clone(), eq.name.clone()],')
          old = '''    let derivatives = residual_blocks
        .iter()
        .flat_map(|r| {
            field_names.iter().map(move |u| BlockDerivative {
                residual: r.clone(),
                unknown: u.clone(),
                structurally_nonzero: edges.iter().any(|e| &e.to == r && &e.from == u),
            })
        })
        .collect();'''
          new = '''    let mut derivatives = Vec::new();
    for residual in &residual_blocks {
        for unknown in &field_names {
            derivatives.push(BlockDerivative {
                residual: residual.clone(),
                unknown: unknown.clone(),
                structurally_nonzero: edges
                    .iter()
                    .any(|edge| &edge.to == residual && &edge.from == unknown),
            });
        }
    }'''
          if old not in s:
              raise SystemExit('expected derivative closure not found')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          rm -f clippy-diagnostic.log clippy-diagnostic.exit
          git rm .github/workflows/wave-compile-fix.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix coupling graph ownership and clean diagnostics'
          git push origin HEAD:agent/r13-r20-wave-a-f
