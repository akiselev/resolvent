name: fix-rsl-fixture-once
on:
  push:
    branches: [agent/r0-r9-agent-physics-stack]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-agent-physics-stack
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/rsl.rs'); t=p.read_text()
          old=r'equation latex "rho cp(T) \\frac{\\partial T}{\\partial t} = 0";'
          new=r'equation latex "rho cp(T) \frac{\partial T}{\partial t} = 0";'
          if old not in t: raise SystemExit('fixture pattern missing')
          p.write_text(t.replace(old,new,1))
          Path('latest-test.txt').unlink(missing_ok=True)
          Path('.github/workflows/fix-rsl-fixture-once.yml').unlink()
      - run: cargo fmt --all
      - shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "fix RSL LaTeX source fixture"
          git push origin HEAD:agent/r0-r9-agent-physics-stack
