name: wave-clippy-diagnostic
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy
      - name: Capture clippy
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > clippy-diagnostic.log 2>&1
          echo "$?" > clippy-diagnostic.exit
          set -e
          git rm .github/workflows/wave-clippy-diagnostic.yml
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add clippy-diagnostic.log clippy-diagnostic.exit
          git commit -m 'Capture clippy diagnostic'
          git push origin HEAD:agent/r13-r20-wave-a-f
