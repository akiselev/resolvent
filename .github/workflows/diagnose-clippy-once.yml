name: diagnose-clippy-once
on:
  push:
    branches: [agent/r0-r9-agent-physics-stack]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-agent-physics-stack
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy
      - name: Capture clippy
        shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > ci-clippy.txt 2>&1
          status=$?
          echo "exit_status=$status" >> ci-clippy.txt
          rm .github/workflows/diagnose-clippy-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-clippy.txt .github/workflows/diagnose-clippy-once.yml
          git commit -m "capture R0-R9 clippy diagnostics"
          git push origin HEAD:agent/r0-r9-agent-physics-stack
