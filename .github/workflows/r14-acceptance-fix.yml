name: r14-acceptance-fix
on:
  push:
    branches: [agent/r13-r20-wave-a-f]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Complete R14 canonical semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scientific.rs')
          s = p.read_text()

          s = s.replace(
          '''pub struct IntegralDecl {\n    pub measure: MeasureV1,\n    pub integrand: Expr,\n}''',
          '''pub struct IntegralDecl {\n    pub measure: MeasureV1,\n    pub integrand: Expr,\n    pub span: SourceSpan,\n}''')

          s = s.replace(
          '''            let measure_name = self.expect_ident_value()?.0;''',
          '''            let measure_span = self.token().span;\n            let measure_name = self.expect_ident_value()?.0;''')
          s = s.replace(
          '''            integrals.push(IntegralDecl { measure, integrand });''',
          '''            integrals.push(IntegralDecl {\n                measure,\n                integrand,\n                span: measure_span,\n            });''')

          old_digest = '''pub fn semantic_digest(module: &ScientificModule) -> String {\n    let bytes = serde_json::to_vec(module).expect("scientific module serialization is infallible");\n    blake3::hash(&bytes).to_hex().to_string()\n}\n'''
          new_digest = '''pub fn semantic_digest(module: &ScientificModule) -> String {\n    // Source spans are provenance, not semantics. Canonicalize them away so formatting,\n    // comments, and whitespace cannot perturb the physics identity.\n    let mut value = serde_json::to_value(module)\n        .expect("scientific module serialization is infallible");\n    fn strip_spans(value: &mut serde_json::Value) {\n        match value {\n            serde_json::Value::Object(map) => {\n                map.remove("span");\n                for child in map.values_mut() {\n                    strip_spans(child);\n                }\n            }\n            serde_json::Value::Array(items) => {\n                for child in items {\n                    strip_spans(child);\n                }\n            }\n            _ => {}\n        }\n    }\n    strip_spans(&mut value);\n    let bytes = serde_json::to_vec(&value)\n        .expect("scientific semantic projection serialization is infallible");\n    blake3::hash(&bytes).to_hex().to_string()\n}\n'''
          if old_digest not in s:
              raise SystemExit('semantic_digest target not found')
          s = s.replace(old_digest, new_digest)

          start = s.index('pub fn format_scientific_module(module: &ScientificModule) -> String {')
          end = s.index('fn coordinate_name', start)
          formatter = r'''pub fn format_scientific_module(module: &ScientificModule) -> String {
    let mut out = String::new();
    out.push_str(&format!("module {};\n\n", module.name));
    for import in &module.imports {
        out.push_str(&format!("use {import};\n"));
    }
    if !module.imports.is_empty() {
        out.push('\n');
    }
    for model in &module.models {
        out.push_str(&format!("model {} {{\n", model.name));
        for domain in &model.domains {
            out.push_str(&format!(
                "    domain {} {{\n        dimension = {};\n        coordinates = {};\n    }}\n\n",
                domain.name,
                domain.dimension,
                coordinate_name(&domain.coordinates)
            ));
        }
        for field in &model.fields {
            out.push_str(&format!(
                "    field {}: {} {} {}(order={}) on {}",
                field.name,
                field_role_name(&field.role),
                shape_name(&field.shape),
                space_name(&field.space.family),
                field.space.order,
                field.domain
            ));
            let has_attrs = field.quantity_kind.is_some()
                || field.unit.is_some()
                || field.nominal.is_some()
                || field.physical_min.is_some()
                || field.physical_max.is_some()
                || field.time_role.is_some();
            if has_attrs {
                out.push_str(" {\n");
                if let Some(kind) = &field.quantity_kind {
                    out.push_str(&format!("        quantity = {};\n", kind.0));
                }
                if let Some(unit) = &field.unit {
                    out.push_str(&format!("        unit = {};\n", unit.0));
                }
                if let Some(value) = &field.nominal {
                    out.push_str(&format!("        nominal = {} {};\n", value.value, value.unit.0));
                }
                if let Some(value) = &field.physical_min {
                    out.push_str(&format!("        min = {} {};\n", value.value, value.unit.0));
                }
                if let Some(value) = &field.physical_max {
                    out.push_str(&format!("        max = {} {};\n", value.value, value.unit.0));
                }
                if let Some(role) = field.time_role {
                    out.push_str(&format!(
                        "        time_role = {};\n",
                        match role {
                            TimeRole::Differential => "differential",
                            TimeRole::Algebraic => "algebraic",
                        }
                    ));
                }
                out.push_str("    };\n");
            } else {
                out.push_str(";\n");
            }
        }
        for decl in &model.parameters {
            out.push_str(&format_value_decl("parameter", decl));
        }
        for decl in &model.constants {
            out.push_str(&format_value_decl("constant", decl));
        }
        for decl in &model.sources {
            out.push_str(&format_value_decl("source", decl));
        }
        for property in &model.properties {
            out.push_str(&format!(
                "    property {} = {};\n",
                property.name,
                format_expr(&property.value)
            ));
        }
        for constitutive in &model.constitutive_laws {
            out.push_str(&format!(
                "    constitutive {} = {};\n",
                constitutive.name,
                format_expr(&constitutive.law)
            ));
        }
        for equation in &model.equations {
            out.push_str(&format!("    equation {}", equation.name));
            if let Some(domain) = &equation.domain {
                out.push_str(&format!(" on {domain}"));
            }
            out.push_str(&format!(
                " {{\n        {} = {};\n    }}\n",
                format_expr(&equation.lhs),
                format_expr(&equation.rhs)
            ));
        }
        for form in &model.forms {
            out.push_str(&format!("    form {} {{\n", form.name));
            for integral in &form.integrals {
                let (measure, target) = match &integral.measure {
                    MeasureV1::Cell(target) => ("cell", target),
                    MeasureV1::Boundary(target) => ("boundary", target),
                    MeasureV1::InteriorFacet(target) => ("interior_facet", target),
                };
                out.push_str(&format!(
                    "        {measure}({target}): {};\n",
                    format_expr(&integral.integrand)
                ));
            }
            out.push_str("    }\n");
        }
        if !model.initial_conditions.is_empty() {
            out.push_str("    initial {\n");
            for condition in &model.initial_conditions {
                out.push_str(&format!(
                    "        {} = {};\n",
                    condition.target,
                    format_expr(&condition.value)
                ));
            }
            out.push_str("    }\n");
        }
        for boundary in &model.boundary_conditions {
            out.push_str(&format!(
                "    boundary {} on {} {{\n        {} {} = {};\n    }}\n",
                boundary.name,
                format_expr(&boundary.region),
                match boundary.kind {
                    BoundaryConditionKind::Dirichlet => "dirichlet",
                    BoundaryConditionKind::Neumann => "neumann",
                    BoundaryConditionKind::Robin => "robin",
                    BoundaryConditionKind::Interface => "interface",
                },
                boundary.target,
                format_expr(&boundary.value)
            ));
        }
        for interface in &model.interface_conditions {
            out.push_str(&format!(
                "    interface {} on {} {{\n        interface {} = {};\n    }}\n",
                interface.name,
                format_expr(&interface.region),
                interface.target,
                format_expr(&interface.value)
            ));
        }
        for observable in &model.observables {
            out.push_str(&format!(
                "    observable {} {{ {}; }}\n",
                observable.name,
                format_expr(&observable.value)
            ));
        }
        for invariant in &model.invariants {
            out.push_str(&format!(
                "    invariant {} {{ {}; }}\n",
                invariant.name,
                format_expr(&invariant.value)
            ));
        }
        for verification in &model.verifications {
            out.push_str(&format!("    @{}", verification.name));
            if !verification.args.is_empty() {
                out.push('(');
                out.push_str(
                    &verification
                        .args
                        .iter()
                        .map(|(name, value)| format!("{name} = {}", format_expr(value)))
                        .collect::<Vec<_>>()
                        .join(", "),
                );
                out.push(')');
            }
            out.push_str(";\n");
        }
        out.push_str("}\n\n");
    }
    out
}
'''
          s = s[:start] + formatter + s[end:]
          p.write_text(s)
          PY
          cargo fmt --all
          git rm .github/workflows/r14-acceptance-fix.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete R14 semantic digest, spans, and formatter'
          git push origin HEAD:agent/r13-r20-wave-a-f
