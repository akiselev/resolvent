name: Materialize FC0-FC1 implementation

on:
  push:
    branches:
      - agent/fc0-fc1-form-v2
    paths:
      - tools/fc0fc1-payload/**
      - .github/workflows/materialize-fc0-fc1.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Reconstruct reviewed source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import io
          import shutil
          import tarfile

          root = Path.cwd().resolve()
          chunk_dir = root / "tools" / "fc0fc1-payload"
          encoded = "".join(
              path.read_text(encoding="utf-8").strip()
              for path in sorted(chunk_dir.iterdir())
              if path.is_file()
          )
          archive = base64.b64decode(encoded, validate=True)
          expected = "19e0de31128f00b6572533cdbaa6626455629881b9884a5be05c80120772ee3b"
          actual = hashlib.sha256(archive).hexdigest()
          if actual != expected:
              raise SystemExit(f"payload checksum mismatch: {actual}")

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              for member in bundle.getmembers():
                  if not member.isfile():
                      raise SystemExit(f"unexpected archive member: {member.name}")
                  destination = (root / member.name).resolve()
                  if root not in destination.parents:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"missing archive member: {member.name}")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with source, destination.open("wb") as output:
                      shutil.copyfileobj(source, output)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/form_v2.rs src/lib.rs STATUS.md
          git rm -r -- tools/fc0fc1-payload .github/workflows/materialize-fc0-fc1.yml
          git diff --cached --check
          git commit -m "Implement FC0-FC1 variational form V2"
          git push origin HEAD:${{ github.ref_name }}
