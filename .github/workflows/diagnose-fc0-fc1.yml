name: Diagnose FC0-FC1

on:
  push:
    branches:
      - agent/fc0-fc1-form-v2
    paths:
      - .github/workflows/diagnose-fc0-fc1.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run and record required gates
        shell: bash
        run: |
          set +e
          cargo fmt --all > /tmp/fmt.log 2>&1
          fmt_status=$?
          cargo clippy --all-targets --all-features -- -D warnings > /tmp/clippy.log 2>&1
          clippy_status=$?
          cargo test --all-features > /tmp/test.log 2>&1
          test_status=$?
          set -e
          python3 - "$fmt_status" "$clippy_status" "$test_status" <<'PY'
          from pathlib import Path
          import sys

          names = ("fmt", "clippy", "test")
          statuses = dict(zip(names, map(int, sys.argv[1:])))
          lines = [
              "# FC0-FC1 Resolvent CI diagnostic",
              "",
              *(f"- `{name}`: {'PASS' if status == 0 else f'FAIL ({status})'}" for name, status in statuses.items()),
              "",
          ]
          for name in names:
              text = Path(f"/tmp/{name}.log").read_text(errors="replace")
              if len(text) > 120_000:
                  text = text[-120_000:]
              lines.extend((f"## {name}", "", "```text", text.rstrip(), "```", ""))
          Path("FC0_FC1_CI.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- src/form_v2.rs src/lib.rs STATUS.md FC0_FC1_CI.md
          git rm -- .github/workflows/diagnose-fc0-fc1.yml
          git diff --cached --check
          git commit -m "Record FC0-FC1 Resolvent validation"
          git push origin HEAD:${{ github.ref_name }}
          if [[ $fmt_status -ne 0 || $clippy_status -ne 0 || $test_status -ne 0 ]]; then
            exit 1
          fi
