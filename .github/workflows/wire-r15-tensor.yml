name: wire-r15-tensor
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  wire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib.rs')
          s=p.read_text()
          if 'pub mod property_tensor;' not in s:
              s=s.replace('pub mod physics;', 'pub mod physics;\npub mod property_tensor;', 1)
          if 'pub use property_tensor::SymmetricTensor2;' not in s:
              s=s.replace('pub use physics::{', 'pub use property_tensor::SymmetricTensor2;\npub use physics::{', 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git rm .github/workflows/wire-r15-tensor.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Expose R15 tensor property frame transforms'
          git push origin HEAD:agent/r13-r20-wave-a-f
