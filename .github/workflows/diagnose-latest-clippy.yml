name: diagnose-latest-clippy
on:
  push:
    branches: [agent/r0-r9-agent-physics-stack]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-agent-physics-stack
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: clippy
      - shell: bash
        run: |
          set +e
          cargo clippy --all-targets --all-features -- -D warnings > latest-clippy.txt 2>&1
          echo "exit_status=$?" >> latest-clippy.txt
          rm .github/workflows/diagnose-latest-clippy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add latest-clippy.txt .github/workflows/diagnose-latest-clippy.yml
          git commit -m "capture remaining R0-R9 clippy diagnostics"
          git push origin HEAD:agent/r0-r9-agent-physics-stack
