name: agent-r0-repair

on:
  push:
    branches:
      - agent/resolvent-stack-r0-r9

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolvent-stack-r0-r9
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Apply compiler-inference repair
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/reference.rs")
          text = path.read_text()
          old = "let mut prescribed = vec![None; mesh.vertices.len()];"
          new = "let mut prescribed: Vec<Option<f64>> = vec![None; mesh.vertices.len()];"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit("expected reference.rs target not found")
      - name: Format
        run: cargo fmt --all
      - name: Commit deterministic repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/reference.rs
          git commit -m "fix R0 reference type inference"
          git push origin HEAD:agent/resolvent-stack-r0-r9
