name: agent-test-repair

on:
  push:
    branches: ["agent/resolvent-stack-r0-r9"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/resolvent-stack-r0-r9
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt
      - name: Preserve implicit unit multiplication and fix partial-Dirichlet fixture
        shell: python
        run: |
          from pathlib import Path

          author = Path("src/author.rs")
          text = author.read_text()
          old = '''        let text = self.tokens[start..self.pos]\n            .iter()\n            .map(render_token)\n            .collect::<String>();'''
          new = '''        let text = self.tokens[start..self.pos]\n            .iter()\n            .map(render_token)\n            .collect::<Vec<_>>()\n            .join(" ");'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected two unit-token joins, found {count}")
          author.write_text(text.replace(old, new))

          reference = Path("src/reference.rs")
          text = reference.read_text()
          old = '''                BoundaryEdge {\n                    vertices: [0, 2],\n                    tag: 1,\n                },'''
          new = '''                BoundaryEdge {\n                    vertices: [0, 2],\n                    tag: 3,\n                },'''
          if text.count(old) != 1:
              raise SystemExit("expected unique first boundary fixture")
          reference.write_text(text.replace(old, new, 1))
      - run: cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/author.rs src/reference.rs
          git diff --cached --quiet && exit 0
          git commit -m "preserve implicit unit products and partial Dirichlet fixture"
          git push origin HEAD:agent/resolvent-stack-r0-r9
