name: r0-r9-repair

on:
  push:
    branches: [agent/r0-r9-agent-physics-stack]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-agent-physics-stack
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Apply bounded compiler repairs
        shell: python
        run: |
          from pathlib import Path
          replacements = {
              "src/calculus.rs": [
                  ("    use crate::expr::{Symbol, SymbolRole};\n", ""),
              ],
              "src/form_compile.rs": [
                  ("use crate::form::{FormExpr, FormProgram, Integral, Measure};", "use crate::form::{FormExpr, Integral, Measure};"),
              ],
              "src/reference.rs": [
                  ("use std::collections::{BTreeMap, BTreeSet};", "use std::collections::BTreeMap;"),
              ],
              "src/generated_verify.rs": [
                  ("Ok(a * dim_inner(store, *x, symbols, memo)?)", "Ok::<Dimension, GeneratedVerifyError>(a * dim_inner(store, *x, symbols, memo)?)"),
              ],
              "src/structural.rs": [
                  ("            columns.insert(symbol, index)\n", "            columns.insert(symbol, index);\n"),
              ],
          }
          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected repair pattern absent in {name}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Format
        run: cargo fmt --all
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "repair R0-R9 compiler diagnostics"
          git push origin HEAD:agent/r0-r9-agent-physics-stack
