name: wave-fixup
on:
  push:
    branches:
      - agent/r13-r20-wave-a-f
permissions:
  contents: write
jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Fix lint and format
        run: |
          perl -0pi -e 's/if !is_interval \{\n            if let Some\(offset\) = unit\.offset_to_si \{\n                value \+= offset\.as_f64\(\);\n            \}\n        \}/if !is_interval \&\& let Some(offset) = unit.offset_to_si {\n            value += offset.as_f64();\n        }/' crates/resolvent-quantities/src/lib.rs
          cargo fmt --all
          git rm .github/workflows/wave-fixup.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix quantity lint and format Wave sources'
          git push origin HEAD:agent/r13-r20-wave-a-f
