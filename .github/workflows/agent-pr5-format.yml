name: agent-pr5-format

on:
  push:
    branches: ["agent/r0-r9-agent-physics-stack"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r0-r9-agent-physics-stack
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.0"
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git diff --cached --quiet && exit 0
          git commit -m "format R0-R9 compiler foundation"
          git push origin HEAD:agent/r0-r9-agent-physics-stack
