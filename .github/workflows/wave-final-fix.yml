name: wave-final-fix
on:
  push:
    branches: [agent/r13-r20-wave-a-f]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r13-r20-wave-a-f
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Apply lint fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/scientific.rs')
          s = p.read_text()
          old = '''            if let Err(message) = check_bound(bound, inputs) {\n                if matches!(self.domain.out_of_validity, OutOfValidityPolicy::Error) {\n                    return Err(ScientificError::Property(message));\n                }\n            }'''
          new = '''            if let Err(message) = check_bound(bound, inputs)\n                && matches!(self.domain.out_of_validity, OutOfValidityPolicy::Error)\n            {\n                return Err(ScientificError::Property(message));\n            }'''
          if old not in s:
              raise SystemExit('expected clippy target not found')
          p.write_text(s.replace(old, new))
          PY
          cargo fmt --all
          git rm .github/workflows/wave-final-fix.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix remaining Resolvent Wave lint'
          git push origin HEAD:agent/r13-r20-wave-a-f
