[workspace]
resolver = "2"
members = ["crates/resolvent-macros"]

[package]
name = "resolvent"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Symbolic scientific compiler and exact algebra substrate"
repository = "https://github.com/akiselev/resolvent"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
resolvent-macros = { path = "crates/resolvent-macros" }

[dev-dependencies]
serde_json = "1"
