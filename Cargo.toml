[package]
name = "resolvent"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Deterministic exact algebra for scientific and geometric consumers"
repository = "https://github.com/akiselev/resolvent"

[dependencies]
blake3 = "1"
dashu = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[features]
default = []
fma-tight = []
metrics = []

[[bench]]
name = "ladder"
harness = false
