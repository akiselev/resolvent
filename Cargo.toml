[package]
name = "resolvent"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Scientific language and semantic compiler for multiphysics models"
repository = "https://github.com/akiselev/resolvent"

[dependencies]
blake3 = "1"
malleus = { path = "../malleus" }
quantitas = { path = "../quantitas" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
