[package]
name = "resolvent"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "Deterministic exact algebra for scientific and geometric consumers"
repository = "https://github.com/akiselev/resolvent"

[dependencies]
blake3 = "1"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["num-bigint", "serde"] }
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
